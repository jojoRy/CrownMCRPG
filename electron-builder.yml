appId: "com.crownmcrpg.launcher"
productName: "CrownMCRPG2"
artifactName: "${productName}-Setup-${version}.${ext}"

directories:
  output: "dist"
  buildResources: "build"

files:
  - "**/*"
  - "!{.gitignore,.vscode,docs,dev-app-update.yml,.eslintrc.json,.nvmrc}"

extraResources:
  - "libraries"

win:
  target: "nsis"
  icon: "build/icon.ico"

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: jojoRy
  repo: CrownMCRPG
